<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found · Abhijit Patra</title>
    <style media="screen">
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Inter', system-ui, sans-serif;
        color: #f4f6fb;
        background: #060713;
        background-image:
          radial-gradient(50rem 50rem at 80% -10%, rgba(124, 92, 255, 0.25), transparent 60%),
          radial-gradient(45rem 45rem at 10% 110%, rgba(34, 211, 238, 0.2), transparent 60%);
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(4rem, 18vw, 8rem);
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, #22d3ee, #4db5ff, #7c5cff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 { font-size: 1.4rem; margin: 0.5rem 0 0.75rem; }
      p { color: rgba(226, 232, 240, 0.7); max-width: 380px; margin: 0 auto 1.75rem; }
      a {
        display: inline-block;
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        color: #04122a;
        background: linear-gradient(135deg, #22d3ee, #4db5ff, #7c5cff);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">Back to home</a>
    </div>
  </body>
</html>
